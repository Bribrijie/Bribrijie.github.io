baseURL = "https://bribrijie.github.io/"
theme = "hugo-coder"

# 中文为默认语言，位于根路径 /；英文在 /en/
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
enableEmoji = true
enableRobotsTXT = true
locale = "zh-cn"

# 首页额外输出 JSON，作为 Fuse.js 搜索索引（每种语言各生成一份）
[outputs]
home = ["HTML", "RSS", "JSON"]

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[taxonomies]
category = "categories"
series = "series"
tag = "tags"

# 语言无关的共享参数
[params]
author = "Runzhe Han"
avatarURL = "images/avatar.svg"
since = 2026
colorScheme = "auto"
hideColorSchemeToggle = false
maxSeeAlsoItems = 5
keywords = "blog,developer,personal,portfolio"

# 自定义样式与脚本，路径相对于项目 assets/
# 注意：顺序即加载顺序，Fuse.js 必须先于 search.js
customSCSS = ["scss/custom.scss"]
customJS = ["js/fuse.min.js", "js/search.js"]

# 全站默认开启文章目录；单篇文章可用 front matter 里 toc = false 关闭
[params.Entry]
toc = true
tocOpen = false

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/Bribrijie/"

# TODO(占位): 替换成你的真实邮箱
[[params.social]]
name = "Email"
icon = "fa-solid fa-envelope fa-2x"
weight = 2
url = "mailto:your-email@example.com"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 3
url = "/index.xml"
rel = "alternate"
type = "application/rss+xml"

# ---------------------------------------------------------------
# 中文（默认语言，根路径）
# ---------------------------------------------------------------
[languages.zh-cn]
label = "中文"
weight = 1
title = "Runzhe Han"
locale = "zh-cn"

[languages.zh-cn.params]
# TODO(占位): 改一句话简介
info = ["这里是占位简介，请替换成你自己的介绍"]
description = "Runzhe Han 的个人网站"
dateFormat = "2006年1月2日"

[[languages.zh-cn.menu.main]]
name = "关于"
weight = 1
url = "about/"

[[languages.zh-cn.menu.main]]
name = "博客"
weight = 2
url = "posts/"

[[languages.zh-cn.menu.main]]
name = "项目"
weight = 3
url = "projects/"

[[languages.zh-cn.menu.main]]
name = "搜索"
weight = 4
url = "search/"

# ---------------------------------------------------------------
# 英文（/en/）
# ---------------------------------------------------------------
[languages.en]
label = "English"
weight = 2
title = "Runzhe Han"
locale = "en"

[languages.en.params]
# TODO(占位): 替换成你的英文简介
info = ["Placeholder tagline — replace with your own introduction"]
description = "Personal website of Runzhe Han"
dateFormat = "January 2, 2006"

[[languages.en.menu.main]]
name = "About"
weight = 1
