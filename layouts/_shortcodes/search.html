<div id="search-container" class="search-container"
  data-index-url="{{ with .Site.Home.OutputFormats.Get "json" }}{{ .RelPermalink }}{{ end }}"
  data-msg-loaded="{{ i18n "search_loaded" (dict "Count" "__N__") }}"
  data-msg-empty="{{ i18n "search_no_results" }}"
  data-msg-failed="{{ i18n "search_load_failed" }}"
>
  <input
    type="search"
    id="search-input"
    class="search-input"
    placeholder="{{ i18n "search_placeholder" }}"
    autocomplete="off"
    aria-label="{{ .Page.Title }}"
  >
  <p id="search-status" class="search-status" hidden></p>
  <ul id="search-results" class="search-results"></ul>
</div>
